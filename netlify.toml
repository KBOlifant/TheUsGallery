[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # False positives: the path value ("./serviceAccountKey.json") is also the default in
  # src/server/env.js, and NEXT_PUBLIC_* values are public by design (inlined into client JS).
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_SERVICE_ACCOUNT_PATH,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"
